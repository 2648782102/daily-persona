name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Validate package metadata
        run: node -e "const p=require('./package.json'); if(p.private!==true) throw new Error('expected private package')"
      - name: Check JavaScript syntax
        run: |
          for file in src/*.js test/*.js; do node --check "$file"; done
      - name: Run tests
        run: npm test
      - name: Check catalog
        run: npm run check --silent
      - name: Resolve today's persona
        run: npm run today --silent
      - name: Smoke-test MCP stdio
        run: node test/stdio-smoke.js
