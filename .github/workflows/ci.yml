name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Validate package metadata
        run: node -e "const p=require('./package.json'); if(p.private!==false) throw new Error('expected publishable package')"
      - name: Install dependencies
        run: npm ci
      - name: Check JavaScript syntax
        run: |
          for file in src/*.js test/*.js evals/*.mjs scripts/*.mjs; do node --check "$file"; done
      - name: Audit dependencies
        run: npm audit --audit-level=low
      - name: Run tests
        run: npm test
      - name: Check catalog
        run: npm run check --silent
      - name: Verify catalog signature
        run: npm run verify --silent
      - name: Run persona evals
        run: npm run evals --silent
      - name: Resolve today's persona
        run: npm run today --silent
      - name: Smoke-test MCP stdio
        run: node test/stdio-smoke.js
      - name: Smoke-test SDK MCP stdio
        run: node test/stdio-sdk-smoke.js
      - name: Validate plugin package
        run: npm run package:check --silent
      - name: Validate npm package contents
        run: npm run pack:check --silent
      - name: Check submission readiness
        run: npm run readiness --silent
      - name: Build container image
        if: matrix.node-version == 24
        run: |
          if docker info >/dev/null 2>&1; then
            docker build -t daily-persona:ci .
          else
            echo "Docker daemon unavailable; skipping image build on this runner."
          fi
