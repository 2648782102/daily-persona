name: Bug report
description: Report a reproducible defect in the protocol, adapters, or tests
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: Commit SHA, tag, or release version
      placeholder: v0.1.0
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include the command or request and the observed result
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node.js version, MCP client and protocol version
    validations:
      required: false
