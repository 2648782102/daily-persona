[mcp_servers.daily_persona]
command = "node"
# 把 REPO_PATH 换成实际克隆路径；若 Codex 的 cwd 是仓库根目录，也可用相对路径。
args = ["REPO_PATH/src/mcp-stdio.js"]

[mcp_servers.daily_persona.env]
DAILY_PERSONA_CATALOG = "REPO_PATH/catalog/personas.v1.json"
DAILY_PERSONA_SIGNATURE = "REPO_PATH/catalog/personas.v1.sig.json"
DAILY_PERSONA_TRUSTED_KEYS = "REPO_PATH/catalog/trusted-keys.json"
